<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi lista de tareas</title>
  </head>
  <body>
    <h1>Mi lista de tareas</h1>

    <form id="formTarea">
      <input id="nombreTarea" type="text" placeholder="Escribe una tarea" />
      <button type="submit">Agregar tarea</button>
    </form>

    <p id="mensaje"></p>
    <p>Tareas pendientes: <span id="cantidad">0</span></p>
    <ul id="listaTareas"></ul>

    <script src="app.js"></script>
  </body>
</html>
